name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pin the workspace revision that exposes Swift main-queue pumping, RunLoopTimer,
# borderless TextField styling, typography, accessibility, view resize events,
# brightness, clipboard, and frameless window APIs.
env:
  NATIVEAPI_REPOSITORY: libnativeapi/nativeapi
  NATIVEAPI_REF: f1741bfc34272d9e39eaa8d4395e261129ea2c74

jobs:
  runtime-macos:
    name: engine and example (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crossswift
    steps:
      - uses: actions/checkout@v4
        with:
          path: crossswift

      - name: Show Swift version
        run: swift --version

      # Counter has no package dependencies on macOS: it imports Apple's
      # SwiftUI, so this also proves `swift run Counter` compiles.
      - name: Build SwiftUIRuntime and Counter
        run: swift build

      - name: Test SwiftUIRuntime
        run: swift test

  web:
    name: build browser bundle (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Swift SDK for WebAssembly
        run: |
          swift sdk install https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5

      - name: Build XcodeDemo for the browser via xcodebuild
        run: |
          swift run xcodebuild \
            -project Examples/XcodeDemo/XcodeDemo.xcodeproj \
            -scheme XcodeDemo \
            -configuration Release \
            -destination generic/platform=Wasm \
            -derivedDataPath build \
            clean build
          test -f build/Build/Products/Release/XcodeDemo/index.html
          test -f build/Build/Products/Release/XcodeDemo/app/XcodeDemo.wasm

  android:
    name: build Android APK (XcodeDemo)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Swift 6.4.2
        run: |
          swift_tarball="swift-6.4.2-RELEASE-ubuntu24.04.tar.gz"
          curl --fail --location --retry 3 --output "/tmp/${swift_tarball}" \
            "https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/${swift_tarball}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${swift_tarball}" -C /opt/swift --strip-components=1
          rm -f "/tmp/${swift_tarball}"
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
          /opt/swift/usr/bin/swift --version

      - name: Install Swift SDK for Android
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz \
            --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233

      - name: Build XcodeDemo APK via xcodebuild
        run: |
          swift run xcodebuild \
            -project Examples/XcodeDemo/XcodeDemo.xcodeproj \
            -scheme XcodeDemo \
            -configuration Release \
            -destination generic/platform=Android \
            -derivedDataPath build/ci-android \
            ANDROID_ABIS=arm64-v8a \
            clean build
          test -f build/ci-android/Build/Products/Release/XcodeDemo/XcodeDemo.apk

  harmony:
    name: cross-compile HarmonyOS ARM64 runtime (XcodeDemo)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crossswift
    steps:
      - uses: actions/checkout@v4
        with:
          path: crossswift

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVEAPI_REPOSITORY }}
          ref: ${{ env.NATIVEAPI_REF }}
          path: nativeapi

      - name: Initialise the nativeapi core submodule
        working-directory: nativeapi
        run: git submodule update --init core

      - name: Install Swift Static Linux SDK (ARM64)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          sdk_name=swift-6.4.2-RELEASE_static-linux-0.1.0
          archive="/tmp/${sdk_name}.artifactbundle.tar.gz"
          curl --fail --location --retry 2 --output "$archive" \
            "https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/${sdk_name}.artifactbundle.tar.gz"
          echo "3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a  $archive" | sha256sum -c -
          mkdir -p /tmp/static-linux-sdk
          tar -xzf "$archive" -C /tmp/static-linux-sdk \
            "${sdk_name}.artifactbundle/${sdk_name}/swift-linux-musl/musl-1.2.5.sdk/aarch64"

      - name: Cross-compile XcodeDemo for HarmonyOS via xcodebuild
        env:
          SWIFT_STATIC_LINUX_SDK: /tmp/static-linux-sdk/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle
          SWIFT_TOOLCHAIN_BIN: /usr/bin
        run: |
          swift run xcodebuild \
            -project Examples/XcodeDemo/XcodeDemo.xcodeproj \
            -scheme XcodeDemo \
            -configuration Release \
            -destination generic/platform=HarmonyOS \
            -derivedDataPath build/ci-harmony \
            clean build
          test -f build/ci-harmony/Build/Products/Release/XcodeDemo/runtime/XcodeDemo.o
          test -f build/ci-harmony/Build/Products/Release/XcodeDemo/entry/src/main/ets/pages/Index.ets

  linux:
    name: build and smoke (Linux, GTK 3)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crossswift
    steps:
      - uses: actions/checkout@v4
        with:
          path: crossswift

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVEAPI_REPOSITORY }}
          ref: ${{ env.NATIVEAPI_REF }}
          path: nativeapi

      - name: Initialise the nativeapi core submodule
        working-directory: nativeapi
        run: git submodule update --init core

      - name: Install GTK, X11 and Xvfb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libsqlite3-dev libx11-dev libxi-dev xvfb dbus

      - name: Build
        run: swift build

      - name: Test
        run: dbus-run-session -- xvfb-run -a swift test

      - name: Smoke test under Xvfb
        run: |
          dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1024x768x24" \
            swift run Counter --smoke

      - name: Build XcodeDemo and DesktopUIGallery via xcodebuild
        run: |
          swift run xcodebuild \
            -project Examples/XcodeDemo/XcodeDemo.xcodeproj \
            -scheme XcodeDemo \
            -configuration Release \
            -derivedDataPath build/ci-linux \
            clean build
          test -x build/ci-linux/Build/Products/Release/XcodeDemo/XcodeDemo
          test -d build/ci-linux/Build/Products/Release/XcodeDemo/Resources
          swift run xcodebuild \
            -project Examples/DesktopUIGallery/DesktopUIGallery.xcodeproj \
            -scheme DesktopUIGallery \
            -configuration Release \
            -derivedDataPath build/ci-linux \
            clean build
          test -x build/ci-linux/Build/Products/Release/DesktopUIGallery/DesktopUIGallery

  windows:
    name: build and smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crossswift
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: crossswift

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVEAPI_REPOSITORY }}
          ref: ${{ env.NATIVEAPI_REF }}
          path: nativeapi

      - name: Initialise the nativeapi core submodule
        working-directory: nativeapi
        run: git submodule update --init core

      # The Swift binding reaches the core through a symlink. Git on Windows
      # cannot always create it; turn a checked-out link file into a junction.
      - name: Ensure the nativeapi core link is a directory
        run: |
          $link = "..\nativeapi\bindings\swift\Sources\CNativeAPI\core"
          if (Test-Path $link -PathType Leaf) {
            Write-Host "Core link was checked out as a file; creating a junction."
            Remove-Item $link -Force
            $target = (Resolve-Path "..\nativeapi\core").Path
            cmd /c mklink /J "$link" "$target"
          }
          Get-Item $link | Format-List FullName,Attributes,LinkType,Target

      # Swift 6.3.1 cannot link AttributedString.runs on Windows (swift#88132).
      # Use the toolchain verified by desktop consumers; language mode stays 5.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          update-sdk-modules: true

      - name: Show Swift version
        run: swift --version

      # Visual Studio 18 (MSVC 14.52) STL requires Clang 22+, while Swift 6.4.2
      # bundles Clang 21. Allow the compiler/STL version mismatch for C++ targets.
      - name: Build
        run: swift build --build-system native -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

      - name: Test
        run: swift test --build-system native -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

      - name: Smoke test
        run: swift run --build-system native -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH Counter --smoke

      - name: Build XcodeDemo via xcodebuild
        run: |
          swift run --build-system native -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH xcodebuild `
            -project Examples/XcodeDemo/XcodeDemo.xcodeproj `
            -scheme XcodeDemo `
            -configuration Release `
            -derivedDataPath build/ci-windows `
            clean build
          if (-not (Test-Path build/ci-windows/Build/Products/Release/XcodeDemo/XcodeDemo.exe)) {
            throw "Missing XcodeDemo.exe"
          }
          if (-not (Test-Path build/ci-windows/Build/Products/Release/XcodeDemo/Resources)) {
            throw "Missing XcodeDemo Resources"
          }
