<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossSwiftUI</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; }
    #swiftui-root { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
    #startup-status { padding: 12px; }
    #crossswift-hmr-badge {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 2147483646;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(24, 24, 27, 0.88);
      color: #f4f4f5;
      font: 500 12px/1.3 system-ui, -apple-system, sans-serif;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #crossswift-hmr-badge[data-visible="true"] { display: inline-flex; }
    #crossswift-hmr-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: crossswift-hmr-pulse 1s ease-in-out infinite;
    }
    @keyframes crossswift-hmr-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    #crossswift-hmr-error {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-sizing: border-box;
    }
    #crossswift-hmr-error[data-visible="true"] { display: flex; }
    #crossswift-hmr-error .panel {
      width: min(820px, 100%);
      max-height: min(80vh, 640px);
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid rgba(239, 68, 68, 0.45);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }
    #crossswift-hmr-error .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.16);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font: 600 13px/1.3 system-ui, -apple-system, sans-serif;
      color: #fca5a5;
    }
    #crossswift-hmr-error .dismiss {
      appearance: none;
      border: 0;
      background: transparent;
      color: #e4e4e7;
      font: 600 18px/1 system-ui, sans-serif;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    #crossswift-hmr-error .dismiss:hover { background: rgba(255, 255, 255, 0.12); }
    #crossswift-hmr-error pre {
      margin: 0;
      padding: 14px 16px;
      overflow: auto;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      color: #f4f4f5;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@bjorn3/browser_wasi_shim": "./app/node_modules/@bjorn3/browser_wasi_shim/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <main id="swiftui-root"><div id="startup-status" role="status">Loading…</div></main>
  <script type="module">
    const status = document.getElementById("startup-status");
    const hmrEndpoint =
      window.__crossSwiftUIHMR ||
      document.querySelector('meta[name="crossswift-hmr"]')?.getAttribute("content") ||
      "";

    function appendCacheBuster(url, version) {
      if (!url || version == null) return url;
      if (/^(data:|blob:|sf:\/\/)/i.test(url)) return url;
      const hashIndex = url.indexOf("#");
      const base = hashIndex >= 0 ? url.slice(0, hashIndex) : url;
      const hash = hashIndex >= 0 ? url.slice(hashIndex) : "";
      const sep = base.includes("?") ? "&" : "?";
      return `${base}${sep}t=${encodeURIComponent(String(version))}${hash}`;
    }

    async function fetchManifest(version) {
      try {
        const url = appendCacheBuster("./Resources/web-manifest.json", version);
        const res = await fetch(url, version != null ? { cache: "no-store" } : undefined);
        if (!res.ok) return null;
        const manifest = await res.json();
        if (version != null && manifest && manifest.images && typeof manifest.images === "object") {
          const bustedImages = {};
          for (const [key, value] of Object.entries(manifest.images)) {
            bustedImages[key] = typeof value === "string" ? appendCacheBuster(value, version) : value;
          }
          return { ...manifest, images: bustedImages };
        }
        return manifest;
      } catch {
        return null;
      }
    }

    async function loadWasmModule(version) {
      if (version == null) {
        const { init } = await import("./app/index.js");
        return { init, module: undefined };
      }
      const query = `?t=${encodeURIComponent(String(version))}`;
      const { init } = await import(`./app/index.js${query}`);
      let modulePath = null;
      try {
        const inst = await import(`./app/instantiate.js${query}`);
        if (typeof inst.MODULE_PATH === "string" && inst.MODULE_PATH.length > 0) {
          modulePath = inst.MODULE_PATH;
        }
      } catch {}
      if (!modulePath) {
        return { init, module: undefined };
      }
      const wasmURL = new URL(`${modulePath}${query}`, new URL("./app/", window.location.href));
      const response = await fetch(wasmURL, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to fetch ${wasmURL.pathname}: HTTP ${response.status}`);
      }
      let module;
      if (typeof WebAssembly.compileStreaming === "function") {
        try {
          module = await WebAssembly.compileStreaming(response.clone());
        } catch {
          module = await WebAssembly.compile(await response.arrayBuffer());
        }
      } else {
        module = await WebAssembly.compile(await response.arrayBuffer());
      }
      return { init, module };
    }

    let badgeEl = null;
    let badgeTextEl = null;
    let errorEl = null;
    let errorPreEl = null;

    function ensureDevUI() {
      if (!badgeEl) {
        badgeEl = document.createElement("div");
        badgeEl.id = "crossswift-hmr-badge";
        badgeEl.setAttribute("role", "status");
        badgeEl.setAttribute("aria-live", "polite");
        const dot = document.createElement("span");
        dot.className = "dot";
        badgeTextEl = document.createElement("span");
        badgeEl.append(dot, badgeTextEl);
        document.body.appendChild(badgeEl);
      }
      if (!errorEl) {
        errorEl = document.createElement("div");
        errorEl.id = "crossswift-hmr-error";
        errorEl.setAttribute("role", "alert");
        const panel = document.createElement("div");
        panel.className = "panel";
        const header = document.createElement("div");
        header.className = "header";
        const title = document.createElement("span");
        title.textContent = "CrossSwiftUI Build Error";
        const dismiss = document.createElement("button");
        dismiss.type = "button";
        dismiss.className = "dismiss";
        dismiss.setAttribute("aria-label", "Dismiss error overlay");
        dismiss.textContent = "×";
        dismiss.addEventListener("click", () => hideError());
        header.append(title, dismiss);
        errorPreEl = document.createElement("pre");
        panel.append(header, errorPreEl);
        errorEl.appendChild(panel);
        document.body.appendChild(errorEl);
      }
    }

    function showBuilding(message) {
      ensureDevUI();
      badgeTextEl.textContent = message && message.trim() ? message : "Building…";
      badgeEl.dataset.visible = "true";
    }

    function hideBuilding() {
      if (badgeEl) badgeEl.dataset.visible = "false";
    }

    function showError(message) {
      ensureDevUI();
      hideBuilding();
      errorPreEl.textContent = message && message.trim() ? message : "Build failed.";
      errorEl.dataset.visible = "true";
    }

    function hideError() {
      if (errorEl) errorEl.dataset.visible = "false";
    }

    async function hotReloadResources(version) {
      const manifest = await fetchManifest(version);
      window.__crossSwiftUIResources = manifest ?? {};
      const bridge = window.__crossSwiftUIHotReload;
      if (bridge && typeof bridge.reloadResources === "function") {
        bridge.reloadResources(window.__crossSwiftUIResources);
      }
      hideBuilding();
      hideError();
    }

    async function hotReloadWasm(version) {
      const [{ init, module }, manifest] = await Promise.all([
        loadWasmModule(version),
        fetchManifest(version),
      ]);

      const bridge = window.__crossSwiftUIHotReload;
      if (bridge) {
        if (typeof bridge.exportState === "function") {
          try {
            const snapshot = bridge.exportState();
            if (typeof snapshot === "string" && snapshot.length > 0) {
              window.__crossSwiftUIHotState = snapshot;
            }
          } catch (error) {
            console.error("[crossswift-hmr] exportState failed:", error);
          }
        }
        if (typeof bridge.unmount === "function") {
          try {
            bridge.unmount();
          } catch (error) {
            console.error("[crossswift-hmr] unmount failed:", error);
          }
        }
      } else {
        document.getElementById("swiftui-root")?.replaceChildren();
      }

      if (manifest !== null) {
        window.__crossSwiftUIResources = manifest;
      }

      await init(module ? { module } : undefined);
      document.getElementById("startup-status")?.remove();
      hideBuilding();
      hideError();
    }

    let reloadQueue = Promise.resolve();
    function enqueue(task) {
      reloadQueue = reloadQueue.then(task).catch((error) => {
        console.error("[crossswift-hmr]", error);
        showError(error instanceof Error ? error.stack || error.message : String(error));
      });
      return reloadQueue;
    }

    if (hmrEndpoint) {
      const source = new EventSource(hmrEndpoint);
      source.onmessage = (event) => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }
        if (!payload || typeof payload.type !== "string") return;
        if (payload.type === "status") {
          if (payload.state === "building") {
            showBuilding(payload.message);
          } else if (payload.state === "ready") {
            hideBuilding();
            hideError();
          } else if (payload.state === "error") {
            showError(payload.message);
          }
        } else if (payload.type === "resources") {
          enqueue(() => hotReloadResources(payload.version ?? Date.now()));
        } else if (payload.type === "wasm") {
          enqueue(() => hotReloadWasm(payload.version ?? Date.now()));
        }
      };
    }

    reloadQueue = reloadQueue.then(async () => {
      try {
        const initialVersion = hmrEndpoint ? Date.now() : null;
        const [{ init, module }, manifest] = await Promise.all([
          loadWasmModule(initialVersion),
          fetchManifest(initialVersion),
        ]);
        if (manifest !== null) {
          window.__crossSwiftUIResources = manifest;
        }
        await init(module ? { module } : undefined);
        status?.remove();
      } catch (error) {
        if (status && status.isConnected) {
          status.textContent = "Could not start the Swift app.";
        }
        console.error(error);
      }
    });
  </script>
</body>
</html>
